apply plugin: 'com.android.application'
apply plugin: 'realm-android'

android {
    namespace 'li.com.bobsonclinic'
    compileSdk 37
    defaultConfig {
        minSdkVersion 24
        targetSdkVersion 37
        multiDexEnabled true
        flavorDimensions "sw168"
    }
    dexOptions {
        javaMaxHeapSize "4G"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
//    kotlinOptions {
//        jvmTarget = "1.8"
//    }
//    packagingOptions {
//        exclude 'META-INF/services/javax.annotation.processing.Processor'
//    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            //signingConfig signingConfigs.release
        }
        debug {
            //signingConfig signingConfigs.debug
        }
    }

    productFlavors {
        pad {
            applicationId "li.com.bobsonclinic"
            versionCode 25
            versionName "1.4.7"
            buildConfigField "String", "STORE_TYPE", "\"main\""

        }
        mobile {
            applicationId "com.moon.momcare.mobile"
            versionCode 3
            versionName "0.1.2"
            buildConfigField "String", "STORE_TYPE", "\"mobile\""
        }

    }

    sourceSets {
        mobile {
            //manifest.srcFile 'src/mobile/AndroidManifest.xml'
            java.srcDirs = ['src/mobile/java']
        }

        pad {
            java.srcDirs = ['src/pad/java']
        }
    }

    useLibrary 'org.apache.http.legacy'
}



dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    testImplementation 'junit:junit:4.12'
    //implementation files('libs/picasso-2.5.2.jar')
    implementation 'com.google.code.gson:gson:2.8.9'
    implementation 'com.squareup:otto:1.3.8'
    implementation 'androidx.appcompat:appcompat:1.0.0'
    implementation 'com.google.android.material:material:1.0.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.0.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'org.jsoup:jsoup:1.8.2'
    implementation 'com.github.ddanny:achartengine:master-SNAPSHOT'
    //implementation project(':FFmpegAndroid')
    implementation 'org.videolan.android:libvlc-all:3.2.6'
//    implementation 'io.salyangoz.updateme:updateme:0.1.0'
    implementation 'androidx.mediarouter:mediarouter:1.0.0'
    implementation 'com.google.android.gms:play-services-gcm:17.0.0'
//    implementation 'com.google.android.gms:play-services-cast:21.0.0'
    implementation 'com.davemorrissey.labs:subsampling-scale-image-view:3.10.0'
    implementation 'com.squareup.picasso:picasso:2.71828'
    // Import the BoM for the Firebase platform
    implementation platform('com.google.firebase:firebase-bom:31.2.3')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-analytics'
//    implementation 'com.google.firebase:firebase-core:19.0.1'
//    implementation 'com.google.firebase:firebase-messaging:21.0.1'
//    implementation 'com.google.firebase:firebase-crash:21.0.1'
//    implementation 'com.google.firebase:firebase-common:21.0.1'
//    implementation 'com.google.firebase:firebase-analytics:21.0.1'
//    implementation 'com.google.firebase:firebase-core:16.0.9'
//    implementation 'com.google.firebase:firebase-config:19.0.1'
    // Fragment
    implementation 'com.github.yokeyword:fragmentation:1.3.7'
    def appCenterSdkVersion = '2.0.0'
    implementation "com.microsoft.appcenter:appcenter-analytics:${appCenterSdkVersion}"
    implementation "com.microsoft.appcenter:appcenter-crashes:${appCenterSdkVersion}"

    // Java 8 support library
    implementation 'com.android.support:multidex:1.0.3'
    implementation 'com.android.support:appcompat-v7:28.0.0'
    implementation 'com.android.support.constraint:constraint-layout:1.1.3'
    implementation 'com.android.support:design:28.0.0'
    implementation 'com.android.support:support-v4:28.0.0'
    implementation 'com.android.support:cardview-v7:28.0.0'
    implementation 'com.android.support:recyclerview-v7:28.0.0'
    implementation 'com.android.support:gridlayout-v7:28.0.0'
}

apply plugin: 'com.google.gms.google-services'